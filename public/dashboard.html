    <script src="js/dashboard-home.js"></script>
<script>
  const menuBtn = document.getElementById('menuToggleBtn');
  const sidebar = document.getElementById('sidebar');

  // ၁။ မျဉ်း ၃ ချောင်း ခလုတ်နှိပ်လျှင် အဖွင့်အပိတ် လုပ်ရန်
  if (menuBtn && sidebar) {
    menuBtn.addEventListener('click', (e) => {
      sidebar.classList.toggle('show-menu');
      e.stopPropagation(); // Event ပျံ့နှံ့မှုကို တားဆီးရန်
    });
  }

  // ၂။ Sidebar အပြင်ဘက်ကို နှိပ်လိုက်လျှင် Sidebar ပြန်ပိတ်သွားစေရန်
  document.addEventListener('click', (e) => {
    if (sidebar && sidebar.classList.contains('show-menu')) {
      // နှိပ်လိုက်သော နေရာသည် Sidebar လည်းမဟုတ်၊ Menu ခလုတ်လည်း မဟုတ်လျှင်
      if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove('show-menu');
      }
    }
  });

  // ၃။ Menu Link တစ်ခုခုကို နှိပ်လိုက်လျှင်လည်း Sidebar ပြန်ပိတ်သွားစေရန်
  const navLinks = document.querySelectorAll('.nav-link');
  navLinks.forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 1024) {
        sidebar.classList.remove('show-menu');
      }
    });
  });
</script>
