<div class="account-container">
  <h2 class="account-title">Account Management</h2>
  <p class="account-subtitle">Setting user permissions</p>

  <div class="account-grid">
    <!-- Create Form Card -->
    <div class="account-card">
      <h3 class="card-title">Create New Account</h3>
      <form id="addUserForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="accEmail" required placeholder="example@gmail.com" class="form-input">
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="accPassword" required placeholder="••••••••" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="accRole" class="form-select">
            <option value="sales">Sales</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">
          Add Account 
        </button>
      </form>
    </div>

    <!-- Account List Table Card -->
    <div class="account-card">
      <h3 class="card-title">Current accounts list</h3>
      <!-- Table Responsive Wrapper -->
      <div class="table-responsive">
        <table class="account-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- Dynamic Users -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
