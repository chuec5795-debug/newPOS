<div class="card" id="mainCard">   
    <div class="form-section">
        <form id="resetForm">
            <h1 class="title">Change Your Password</h1>
            <p id="msg" style="font-weight: bold; margin-bottom: 15px;"></p>
            
            <div class="emailform">   
                <label>Email: <span class="star">*</span></label>    
                <input id="resetUsername" type="email" placeholder="Enter Email" required>    
            </div>                
            <div class="passwordform">
                <label>New Password: <span class="star">*</span></label>
                <div class="password-group">
                    <input id="newPassword" type="password" placeholder="Enter New Password" required>
                </div>
            </div>              
            <div class="passwordform">
                <label>Confirm Password: <span class="star">*</span></label>
                <div class="password-group">
                    <input id="confirmPassword" type="password" placeholder="Confirm New Password" required>
                </div>
            </div>                
            <div class="login-btn">
                <button id="changeBtn" type="button">Save New Password</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <a href="login.html" id="forgotpasswordbtn">Back to Login</a>
            </div>
        </form>
    </div>

    <div class="img-section" id="imgSection">
        <img src="IMG/forgot-password-illustration-svg-download-png-6061606.webp" alt="Forgot Password Illustration">
    </div>
</div>


<div id="successBox" class="card" style="display: none; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; max-width: 550px;">
    <div style="width: 100%;">
        <div style="width: 80px; height: 80px; background-color: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h2 style="font-size: 26px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Password Changed!</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 24px;">Your password has been changed successfully.</p>
        <div class="login-btn" style="max-width: 280px; margin: 0 auto;">
            <button type="button" onclick="window.location.href='login.html'">Back to Login</button>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
