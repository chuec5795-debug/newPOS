<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales History</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f8f9fa; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .nav-btn { display: inline-block; padding: 8px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #2c3e50; color: white; }
    .btn-clear { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <a href="dashboard.html" class="nav-btn"> Back to Cashier POS</a>
  <h2>📊 Sales History</h2>

  <button class="btn-clear" onclick="clearSalesHistory()">Clear Sales History</button>

  <table>
    <thead>
      <tr>
        <th>Transaction ID</th>
        <th>Date & Time</th>
        <th>Items Sold</th>
        <th>Payment</th>
        <th>Grand Total</th>
      </tr>
    </thead>
    <tbody id="salesTableBody">
      <tr><td colspan="5" style="text-align:center;">Loading history...</td></tr>
    </tbody>
  </table>
</div>

<script>
  function renderSalesHistory() {
    let salesHistory = JSON.parse(localStorage.getItem('salesHistory')) || [];
    let tbody = document.getElementById("salesTableBody");

    if (!tbody) return;

    if (salesHistory.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No sales recorded yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = "";

    // Reverse array to display newest sales first
    salesHistory.slice().reverse().forEach(sale => {
      let itemsList = sale.items ? sale.items.map(i => `${i.name} (x${i.quantity})`).join(", ") : "N/A";
      let grandTotal = sale.totals && sale.totals.grandTotal ? sale.totals.grandTotal.toFixed(2) : "0.00";

      let tr = document.createElement("tr");
      tr.innerHTML = `
       <td><strong>${sale.id ? sale.id : ('TXN-' + Math.floor(100000 + Math.random() * 900000))}</strong></td>
        <td>${sale.date || 'N/A'}</td>
        <td>${itemsList}</td>
        <td>${sale.paymentMethod || 'Cash'}</td>
        <td><strong>${grandTotal} Ks</strong></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function clearSalesHistory() {
    if (confirm("Are you sure you want to delete all sales history?")) {
      localStorage.removeItem('salesHistory');
      renderSalesHistory();
    }
  }

  // Execute rendering when page finishes loading
  document.addEventListener("DOMContentLoaded", renderSalesHistory);
</script>

</body>
</html>
